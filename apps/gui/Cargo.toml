[package]
name = "dowel-craft"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dowel-craft"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
dowel = { workspace = true }
script = { path = "../../crates/script" }
dowel-craft-cli = { path = "../cli" }
dowel-craft-mcp = { path = "../mcp" }
serde = { workspace = true }
serde_json = { workspace = true }
eframe = "0.36"
egui = "0.36"
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "15ed713b8fc622302a7f2920f710cec7d261fa9a" }
rfd = "0.17"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
interprocess = "2"

[target.'cfg(windows)'.dependencies]
widestring = "1"

[build-dependencies]
# Puts the icon into the Windows .exe (Explorer, taskbar, Start menu); does nothing on other systems.
embed-resource = "3"
