# A v* tag (e.g. v0.2.0) builds Linux, macOS (Apple Silicon and Intel) and Windows
# and attaches the archives to the GitHub Release of that tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - run: cargo build --release --locked --target ${{ matrix.target }} --bin dowel-craft --bin dowel-craft-console

      - name: Archive (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          dir=dowel-craft-${{ matrix.name }}
          mkdir "$dir"
          cp target/${{ matrix.target }}/release/dowel-craft README.md NOTICE.md LICENSE "$dir"/
          if [ "$RUNNER_OS" = macOS ]; then
            scripts/macos-app.sh target/${{ matrix.target }}/release/dowel-craft "$(cargo pkgid -p dowel-craft | sed 's/.*[#@]//')" "$dir"
            # Disk image: the app and an Applications link to drag it onto.
            # makehybrid + convert, not `create -srcfolder`, which is flaky on CI ("Resource busy").
            stage=$(mktemp -d)
            ditto "$dir/Dowel Craft.app" "$stage/Dowel Craft.app"
            ln -s /Applications "$stage/Applications"
            hdiutil makehybrid -hfs -hfs-volume-name "Dowel Craft" -hfs-openfolder "$stage" -o raw.dmg "$stage"
            hdiutil convert raw.dmg -format UDZO -o "$dir.dmg"
          fi
          tar czf "$dir.tar.gz" "$dir"
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "dowel-craft-${{ matrix.name }}"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/dowel-craft.exe" $dir
          # Console twin: in cmd/PowerShell `dowel-craft` picks the .com, so command output reaches the terminal.
          Copy-Item "target/${{ matrix.target }}/release/dowel-craft-console.exe" "$dir/dowel-craft.com"
          Copy-Item README.md, NOTICE.md, LICENSE $dir
          Compress-Archive $dir "$dir.zip"
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
          $version = (cargo pkgid -p dowel-craft) -replace '.*[#@]', ''
          wix build packaging/windows/dowel-craft.wxs -arch x64 -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext `
            -d "Version=$version" -d "BinDir=dowel-craft-${{ matrix.name }}" -d "IconPath=apps/gui/assets/icon.ico" `
            -o "dowel-craft-${{ matrix.name }}.msi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dowel-craft-*.tar.gz
            dowel-craft-*.zip
            dowel-craft-*.dmg
            dowel-craft-*.msi

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      # Fine-grained token with Contents: write on shoman4eg/homebrew-tap; without it the formula step is skipped.
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # --prerelease while the app is in early alpha.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes --prerelease dist/dowel-craft-*
      - name: Homebrew formula and cask
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.TAP_TOKEN }}
        run: |
          # Committed through the API, so GitHub signs it.
          put() {
            path=repos/shoman4eg/homebrew-tap/contents/$1
            sha=$(gh api "$path" --jq .sha 2>/dev/null || true)
            gh api -X PUT "$path" -f message="$2 ${GITHUB_REF_NAME#v}" -f content="$(base64 -w0 "$3")" ${sha:+-f sha="$sha"}
          }
          scripts/homebrew-formula.sh "$GITHUB_REF_NAME" dist > dowel-craft.rb
          scripts/homebrew-cask.sh "$GITHUB_REF_NAME" dist > dowel-craft-app.rb
          put Formula/dowel-craft.rb dowel-craft dowel-craft.rb
          put Casks/dowel-craft-app.rb dowel-craft-app dowel-craft-app.rb
